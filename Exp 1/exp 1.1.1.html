<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body style="text-align: center;">
<h2>Student Registration</h2>
<form>
    <label>
        Name:
        <input type="text" required>
    </label>
    <br><br>
    <label>
        Email:
        <input type="email" required>
    </label>
    <br><br>
    <label>
        Age:
        <input type="number"
        title = "must contain 1-100 number"
        min="1"
        max="100"
        style="width: 150px;" 
        required>
    </label>
    <br><br>
    <input type="submit" value="Register">
</form>
</body>
</html>
