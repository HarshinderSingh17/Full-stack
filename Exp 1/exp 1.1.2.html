<!DOCTYPE html>
<html>
<head>
    <title>Simple Bank App</title>
</head>

<body style="display:flex;justify-content:center;align-items:center;height:100vh;background:#f2f2f2;font-family:Arial;">

<div style="background:white;padding:20px;border-radius:10px;width:250px;text-align:center;">

    <h3>Bank Account</h3>

    <p style="font-size:18px;font-weight:bold;">
        Balance: ₹<span id="balance">10000</span>
    </p>

    <input type="number" id="amount" placeholder="Enter amount"
           style="width:100%;padding:8px;margin-bottom:10px;">

    <button onclick="deposit()" 
            style="padding:8px;width:45%;margin-right:5px;background:green;color:white;border:none;">
        Deposit
    </button>

    <button onclick="withdraw()" 
            style="padding:8px;width:45%;background:red;color:white;border:none;">
        Withdraw
    </button>

    <p id="msg" style="margin-top:10px;"></p>

</div>

<script>
    let balance = 10000;

    function deposit() {
        let amount = Number(document.getElementById("amount").value);

        if (amount <= 0) {
            document.getElementById("msg").innerHTML = "Enter valid amount";
            return;
        }

        balance += amount;
        document.getElementById("balance").innerHTML = balance;
        document.getElementById("msg").innerHTML = "Amount Deposited";
    }

    function withdraw() {
        let amount = Number(document.getElementById("amount").value);

        if (amount <= 0) {
            document.getElementById("msg").innerHTML = "Enter valid amount";
            return;
        }

        if (amount > balance) {
            document.getElementById("msg").innerHTML = "Insufficient Balance";
            return;
        }

        balance -= amount;
        document.getElementById("balance").innerHTML = balance;
        document.getElementById("msg").innerHTML = "Amount Withdrawn";
    }
</script>

</body>
</html>
