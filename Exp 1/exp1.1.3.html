<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>

<style>
:root{
    --bg1:#0a1020;
    --bg2:#0e1a30;
    --glass:rgba(255,255,255,0.06);
    --border:rgba(255,255,255,0.15);
    --text:white;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    color:var(--text);
    height:100vh;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
}

/* Header */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:25px 40px;
    font-size:28px;
}

/* Toggle button */
button{
    background:var(--glass);
    color:white;
    border:1px solid var(--border);
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

/* Main grid */
.dashboard{
    display:grid;
    grid-template-columns:260px 1fr;
    gap:30px;
    padding:30px 40px;
}

/* Navigation panel */
.sidebar{
    height:420px;
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
}

/* Cards area */
.cards{
    display:grid;
    grid-template-columns:repeat(3, 220px);
    gap:30px;
}

/* Individual card */
.card{
    height:140px;
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}
</style>
</head>

<body>

<div class="header">
    <div>Admin Dashboard</div>
    <button onclick="toggleTheme()">☀ Light Mode</button>
</div>

<div class="dashboard">
    <div class="sidebar">Navigation</div>

    <div class="cards">
        <div class="card">Analytics</div>
        <div class="card">Users</div>
        <div class="card">Settings</div>
    </div>
</div>

<script>
let dark = true;

function toggleTheme(){
    if(dark){
        document.documentElement.style.setProperty("--bg1","#f2f2f2");
        document.documentElement.style.setProperty("--bg2","#e6e6e6");
        document.documentElement.style.setProperty("--glass","rgba(0,0,0,0.05)");
        document.documentElement.style.setProperty("--border","rgba(0,0,0,0.2)");
        document.documentElement.style.setProperty("--text","black");
    }else{
        document.documentElement.style.setProperty("--bg1","#0a1020");
        document.documentElement.style.setProperty("--bg2","#0e1a30");
        document.documentElement.style.setProperty("--glass","rgba(255,255,255,0.06)");
        document.documentElement.style.setProperty("--border","rgba(255,255,255,0.15)");
        document.documentElement.style.setProperty("--text","white");
    }
    dark = !dark;
}
</script>

</body>
</html>
